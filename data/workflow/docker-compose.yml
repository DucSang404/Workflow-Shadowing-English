name: shadowing

services:
  n8n:
    build:
      context: .
      dockerfile: Dockerfile.n8n
    image: n8n-ffmpeg:2.36.9
    container_name: shadowing-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - N8N_SECURE_COOKIE=false
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - GENERIC_TIMEZONE=Asia/Ho_Chi_Minh
      - TZ=Asia/Ho_Chi_Minh
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_VERSION_NOTIFICATIONS_ENABLED=false
      - N8N_RUNNERS_ENABLED=true
      # n8n 2.0 disables executeCommand + localFileTrigger by default.
      # An explicit empty exclude list opts back in; required for the ffmpeg step.
      - NODES_EXCLUDE=[]
      # n8n 2.x confines node file access to ~/.n8n-files by default.
      # Widen it to the task's own directory only - .n8n itself stays blocked
      # by N8N_BLOCK_FILE_ACCESS_TO_N8N_FILES, which remains on.
      - N8N_RESTRICT_FILE_ACCESS_TO=/data/workflow
      - N8N_PERSONALIZATION_ENABLED=false
      # Code node needs these whitelisted to require() them
      - NODE_FUNCTION_ALLOW_BUILTIN=fs,path,child_process,crypto
      - NODE_FUNCTION_ALLOW_EXTERNAL=ms
      - EDGE_TTS_URL=http://edge-tts:5050
    volumes:
      - ./n8n_data:/home/node/.n8n
      - ./:/data/workflow
    depends_on:
      - edge-tts

  edge-tts:
    image: travisvn/openai-edge-tts:latest
    container_name: shadowing-edge-tts
    restart: unless-stopped
    ports:
      - "5050:5050"
    environment:
      - API_KEY=${EDGE_TTS_API_KEY}
      - PORT=5050
      - DEFAULT_VOICE=en-US-AvaNeural
      - DEFAULT_RESPONSE_FORMAT=mp3
      - REQUIRE_API_KEY=True
